<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Offline · EmergencyApp</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: #faf7f2; color: #1c1a17; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 32rem; padding: 2rem; background: white; border: 1px solid #ddd6ca; border-radius: 1rem; }
      h1 { margin-top: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>EmergencyApp can show some information you recently viewed on this device. New incidents, updates, and messages cannot be sent until the connection returns.</p>
      <p>For immediate danger, call your local emergency services directly.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
